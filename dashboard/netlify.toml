[build]
  command = "bun run build"
  publish = "dist"

# Session tokens live in localStorage, so any XSS = session theft. These
# headers shrink that surface: no framing, no MIME sniffing, locked-down
# resource loading, and HTTPS-only once deployed. Only VITE_SUPABASE_URL and
# VITE_SUPABASE_PUBLISHABLE_KEY may be set on the site; never DATABASE_URL
# (direct Postgres write access for scripts/dev-db.ts) or DEV_0_TOKEN_HASH.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
