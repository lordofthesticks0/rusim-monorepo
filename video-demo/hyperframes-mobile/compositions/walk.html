      // freezes (as in the display video). The next camera move starts from where it ends.
      const creep = (t, d, f = 1.025) => camTo(t, d, cam.cx, cam.cy, +(cam.k * f).toFixed(4), "sine.inOut");
      // ---- Scrolling: the page moves inside the phone; nothing else does. ----
      const scrollTo = (t, d, y, ease = "power2.inOut") => {
        tl.fromTo(RIG, { "--sy": sy }, { "--sy": y, duration: d, ease, ...NI }, t);
        sy = y;
      };
      // ---- Touch: the dot lands 0.4 s before the press, presses, and lifts 0.3 s after. ----
      const press = (t) => {
        tl.fromTo(RIG, { "--press": 1 }, { "--press": 0.86, duration: 0.07, ease: "power2.out", ...NI }, t);
        tl.fromTo(RIG, { "--press": 0.86 }, { "--press": 1, duration: 0.14, ease: "power2.out", ...NI }, t + 0.07);
      };
      const tap = (t, x, y) => {
        tl.set(RIG, { "--px": x, "--py": y }, t - 0.42);
        tl.fromTo("#walk-touch", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out", ...NI }, t - 0.4);
        press(t);
        tl.fromTo("#walk-touch", { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.15, duration: 0.25, ease: "power1.in", ...NI }, t + 0.3);
      };
      // Stands in for the app's own quick response (a page or tooltip appearing): real speed.
      const fadeIn = (sel, t, d = 0.12) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out", ...NI }, t);

      // ---- Captions: three entrances in rotation, one exit. ----
      const capWords = (id, t, end) => {
        tl.fromTo(`#${id} .w`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.26, stagger: 0.134, ease: "power2.out", ...NI }, t);
        capOut(id, end);
      };
      const capInk = (id, t, end) => {
        tl.fromTo(`#${id} .w`, { color: "#c9c9c4" }, { color: "#000000", duration: 0.24, stagger: 0.16, ease: "power1.out", ...NI }, t);
        capOut(id, end);
      };
      const capLine = (id, t, end) => {
        tl.fromTo(`#${id} .line`, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.36, ease: "power2.out", ...NI }, t);
        capOut(id, end);
      };
      const capOut = (id, end) => {
        tl.fromTo(`#${id} .line`, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in", ...NI }, end - 0.3);
      };

      // Pace: the same times as the desktop film's second cut (2026-11-26). Taps land on its
      // click times; the drawer adds a menu tap before each change of view.

      // ===== Login (0 – 16.4) =====
      capWords("walk-cap-1", 0.5, 8.8);
      camTo(4.4, 2.4, 195, 595, 2.3);
      tap(7.9, 173, 610);
      // 17 characters, one every 164 ms: the cover over the dots shrinks one dot at a time.
      // steps(16) holds 17 values, each for duration / 17, so the duration is 17 x 0.164 s.
      tl.fromTo("#walk-cover-bar", { scaleX: 16 / 17 }, { scaleX: 0, duration: 17 * 0.164, ease: "steps(16)", ...NI }, 8.3);
      capInk("walk-cap-2", 9.1, 14.4);
      tap(13.0, 195, 676);
      camTo(14.6, 2.6, ...WIDE);
      capLine("walk-cap-3", 16.0, 21.0);
      creep(17.2, 4.0);

      // ===== Monitoring (16.4 – 36.9) =====
      camTo(21.2, 2.6, 195, 341, 2.35);
      capWords("walk-cap-4", 22.0, 27.5);
      // Pull back while the page scrolls up, so the chamber grid and the five sensors share a screen.
      scrollTo(25.6, 1.8, 219);
      camTo(25.6, 1.8, ...WIDE);
      tap(27.7, 168.5, 61);
      capInk("walk-cap-5", 28.2, 36.4);
      camTo(29.2, 2.6, 195, 650, 2.2);
      // Back to the top for the menu.
      scrollTo(33.6, 1.2, 0);
      camTo(33.6, 2.0, 195, 200, 2.2);
      tap(35.7, 34, 28);
      tap(36.9, 159.5, 285);
      capLine("walk-cap-6", 37.4, 42.8);

      // ===== Experiment history (36.9 – 96.5) =====
      camTo(38.1, 2.5, 195, 355, 2.25);
      tap(42.9, 195, 326);
      fadeIn("#walk-s-hexp4", 42.9);
      scrollTo(43.2, 3.2, 538);
      camTo(43.2, 3.2, 195, 640, 2.25);
      capWords("walk-cap-7", 43.8, 50.4);
      tap(47.1, 195, 468);
      // Down the five charts to CH4.
      scrollTo(50.6, 6.4, 1693);
      camTo(50.6, 6.4, 195, 422, 2.0);
      capInk("walk-cap-8", 51.2, 59.8);
      tap(60.0, 141.5, 492.5);
      fadeIn("#walk-s-tip", 60.0, 0.14);
      camTo(60.4, 2.8, 170, 470, 3.2);
      capLine("walk-cap-9", 60.4, 66.6);
      creep(63.2, 3.6);
      tl.fromTo("#walk-s-tip", { opacity: 1 }, { opacity: 0, duration: 0.12, ...NI }, 66.8);
      scrollTo(66.8, 3.2, 538);
      camTo(66.8, 3.2, 195, 470, 2.2);
      tap(72.1, 183.5, 375);
      capWords("walk-cap-10", 72.8, 80.0);
      scrollTo(73.2, 2.6, 720);
      camTo(73.2, 2.6, 195, 534, 1.44);
      creep(75.8, 4.2);
      scrollTo(80.0, 2.6, 538);
      camTo(80.0, 2.6, 195, 245, 2.3);
      tap(83.1, 290, 194);

      // The button becomes the CSV sheet: uniform scale from the button's place on screen
      // (centre 1178.5, 342.7; 289.8 px wide = 0.207 of the sheet).
      tl.fromTo("#walk-wash", { opacity: 0 }, { opacity: 0.86, duration: 0.6, ease: "power1.out", ...NI }, 83.2);
      tl.fromTo("#walk-sheet", { x: 218.5, y: -113.3, scale: 0.207, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 1.2, ease: "power3.out", ...NI }, 83.1);
      tl.fromTo("#walk-sheet .csv.head", { opacity: 0 }, { opacity: 1, duration: 0.2, ...NI }, 84.1);
      tl.fromTo("#walk-sheet .csv:not(.head)", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.14, ...NI }, 84.3);
      capInk("walk-cap-11", 83.8, 93.2);
      tl.fromTo("#walk-sheet", { x: 0, y: 0, scale: 1 }, { x: 218.5, y: -113.3, scale: 0.207, duration: 0.9, ease: "power3.in", ...NI }, 92.8);
      tl.fromTo("#walk-sheet", { opacity: 1 }, { opacity: 0, duration: 0.3, ...NI }, 93.4);
      tl.fromTo("#walk-wash", { opacity: 0.86 }, { opacity: 0, duration: 0.8, ease: "power1.in", ...NI }, 92.9);

      // ===== Compare (96.5 – 128.8) =====
      scrollTo(93.8, 1.0, 0);
      camTo(93.8, 1.5, 195, 200, 2.2);
      tap(95.4, 34, 28);
      tap(96.5, 159.5, 331);
      capLine("walk-cap-12", 97.2, 113.6);
      camTo(97.8, 2.4, 195, 380, 2.3);
      tap(101.3, 195, 281);
      fadeIn("#walk-s-cmp1e", 101.3, 0.1);
      tap(102.3, 195, 361);
      fadeIn("#walk-s-cmp1p", 102.3, 0.1);
      tap(104.3, 195, 413);
      // The chart is below the fold: scroll so the controls and the chart share the screen.
      scrollTo(105.6, 2.0, 135);
      camTo(105.6, 2.0, 195, 472, 1.22);
      tap(109.1, 195, 146);
      fadeIn("#walk-s-cmp2p", 109.1, 0.1);
      tap(111.1, 121.5, 278);
      scrollTo(113.8, 2.6, 205);
      camTo(113.8, 2.6, 195, 630, 2.2);
      capWords("walk-cap-13", 114.8, 121.0);
      creep(116.4, 4.8);
      scrollTo(121.2, 1.4, 0);
      camTo(121.2, 2.8, ...WIDE);
      capInk("walk-cap-14", 122.0, 128.8);
      // The menu opens on the three views of the claim; the hold creeps in about the drawer's
      // RuSim mark (screen 34, 34; on video 802.2, 79.8), so the mark stays put for the zoom.
      tap(124.4, 34, 28);
      camTo(124.0, 4.8, 191.09, 412.5, 1.0045, "sine.inOut");

      // ===== Zoom through the RuSim mark (128.8 – 130.6), original speed =====
      // Two parts, so the mark travels straight to the centre: first centre it with a slight
      // zoom, then zoom about that fixed point. It lands at 130.5 and holds, so the last frame
      // equals the end card's first (the mark alone, 168 px, at 960, 460).
      tl.fromTo("#walk-band", { opacity: 1 }, { opacity: 0, duration: 0.4, ...NI }, 128.8);
      camTo(128.8, 0.9, 34, 34, 1.5);
      camTo(129.7, 0.8, 34, 34, 6.0, "power3.in");
      tl.fromTo("#walk-mark", { opacity: 0 }, { opacity: 1, duration: 0.2, ...NI }, 129.8);
      tl.fromTo("#walk-phone", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power1.in", ...NI }, 130.1);

      window.__timelines["walk"] = tl;
    })();
  </script>
