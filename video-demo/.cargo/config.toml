# The prebuilt FFmpeg that ffmpeg-sys-fframes downloads links against x264 ABI 163.
# Fedora 44 ships x264 ABI 165 (x264-devel 0.165), so linking fails with
# "undefined symbol: x264_encoder_open_163". Building FFmpeg from source against the
# system x264 avoids that. Needs nasm and x264-devel.
[env]
FFMPEG_FORCE_BUILD = "1"
