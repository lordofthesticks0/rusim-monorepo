<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>RuSim dashboard demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f7f7f5;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: #f7f7f5;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="141.6" data-width="1920" data-height="1080">
      <div id="ground"></div>

      <!-- Scenes: one continuous take through the app, then the end card. -->
      <div id="walk" data-composition-id="walk" data-composition-src="compositions/walk.html"
        data-start="0" data-duration="130.6" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="130.6" data-duration="11" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>

      <!-- Sound effects only (no music). Each starts one frame after its picture. -->
      <audio id="sfx-tap-01" class="clip" src="assets/sfx/sfx-tap.wav" data-start="7.933" data-duration="0.15" data-volume="0.7" data-track-index="2"></audio>
      <audio id="sfx-typing" class="clip" src="assets/sfx/typing.wav" data-start="8.333" data-duration="2.774" data-volume="0.8" data-track-index="2"></audio>
      <audio id="sfx-tap-02" class="clip" src="assets/sfx/tap-b.wav" data-start="13.033" data-duration="0.159" data-volume="0.7" data-track-index="2"></audio>
      <audio id="sfx-tap-03" class="clip" src="assets/sfx/tap-c.wav" data-start="27.733" data-duration="0.141" data-volume="0.7" data-track-index="2"></audio>
      <audio id="sfx-tap-04" class="clip" src="assets/sfx/sfx-tap.wav" data-start="36.933" data-duration="0.15" data-volume="0.7" data-track-index="2"></audio>
      <audio id="sfx-tap-05" class="clip" src="assets/sfx/tap-b.wav" data-start="42.933" data-duration="0.159" data-volume="0.7" data-track-index="2"></audio>
      <audio id="sfx-tap-06" class="clip" src="assets/sfx/tap-c.wav" data-start="47.133" data-duration="0.141" data-volume="0.7" data-track-index="2"></audio>
      <audio id="sfx-tap-07" class="clip" src="assets/sfx/sfx-tap.wav" data-start="72.133" data-duration="0.15" data-volume="0.7" data-track-index="2"></audio>
      <audio id="sfx-tap-08" class="clip" src="assets/sfx/tap-b.wav" data-start="83.133" data-duration="0.159" data-volume="0.7" data-track-index="2"></audio>
      <audio id="sfx-lines" class="clip" src="assets/sfx/lines.wav" data-start="84.333" data-duration="1.55" data-volume="0.9" data-track-index="2"></audio>
      <audio id="sfx-tap-09" class="clip" src="assets/sfx/tap-c.wav" data-start="96.533" data-duration="0.141" data-volume="0.7" data-track-index="2"></audio>
      <audio id="sfx-tap-10" class="clip" src="assets/sfx/sfx-tap.wav" data-start="102.333" data-duration="0.15" data-volume="0.7" data-track-index="2"></audio>
      <audio id="sfx-tap-11" class="clip" src="assets/sfx/tap-b.wav" data-start="104.333" data-duration="0.159" data-volume="0.7" data-track-index="2"></audio>
      <audio id="sfx-tap-12" class="clip" src="assets/sfx/tap-c.wav" data-start="109.133" data-duration="0.141" data-volume="0.7" data-track-index="2"></audio>
      <audio id="sfx-tap-13" class="clip" src="assets/sfx/sfx-tap.wav" data-start="111.133" data-duration="0.15" data-volume="0.7" data-track-index="2"></audio>
      <audio id="sfx-whoosh" class="clip" src="assets/sfx/sfx-whoosh.wav" data-start="129.738" data-duration="1.2" data-volume="0.45" data-track-index="2"></audio>
      <audio id="sfx-swell" class="clip" src="assets/sfx/sfx-swell.wav" data-start="130.144" data-duration="4" data-volume="0.5" data-track-index="3"></audio>
      <audio id="sfx-url" class="clip" src="assets/sfx/url.wav" data-start="132.788" data-duration="1.47" data-volume="0.9" data-track-index="2"></audio>
      <!-- The QR card arrives: a soft whoosh, its loudest point (0.762 s in) at end card 4.7 s. -->
      <audio id="sfx-whoosh-qr" class="clip" src="assets/sfx/sfx-whoosh.wav" data-start="134.538" data-duration="1.2" data-volume="0.3" data-track-index="2"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
