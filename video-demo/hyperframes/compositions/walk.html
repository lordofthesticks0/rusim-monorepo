  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const RIG = "#walk-rig";
      const NI = { immediateRender: false };

      // ---- Camera: page point (cx, cy) at stage centre, scale k. ----
      let cam = { cx: 720, cy: 405, k: 1.12 };
      let cur = { px: 1700, py: 640 };
      tl.set(RIG, { "--cx": 720, "--cy": 405, "--k": 1.12, "--px": 1700, "--py": 640, "--press": 1 }, 0);
      // Baselines for elements tweened more than once (they are hidden until their clip starts).
      tl.set("#walk-sheet", { x: 748.7, y: -44, scale: 0.1395 }, 0);
      tl.set("#walk-wash", { opacity: 0 }, 0);
      const camTo = (t, d, cx, cy, k, ease = "power2.inOut") => {
        tl.fromTo(RIG, { "--cx": cam.cx, "--cy": cam.cy, "--k": cam.k }, { "--cx": cx, "--cy": cy, "--k": k, duration: d, ease, ...NI }, t);
        cam = { cx, cy, k };
      };
      // A hold longer than 3 s creeps in by 2.5 % about the stage centre, so the picture never
      // freezes (as in the display video). The next camera move starts from where it ends.
      const creep = (t, d, f = 1.025) => camTo(t, d, cam.cx, cam.cy, +(cam.k * f).toFixed(4), "sine.inOut");
      // ---- Cursor, in page coordinates; x and y on different eases for a slight arc. ----
      const curTo = (t, d, px, py) => {
        tl.fromTo(RIG, { "--px": cur.px }, { "--px": px, duration: d, ease: "power2.inOut", ...NI }, t);
        tl.fromTo(RIG, { "--py": cur.py }, { "--py": py, duration: d, ease: "power3.inOut", ...NI }, t);
        cur = { px, py };
      };
      const curSet = (t, px, py) => {
        tl.set(RIG, { "--px": px, "--py": py }, t);
        cur = { px, py };
      };
      const press = (t) => {
        tl.fromTo(RIG, { "--press": 1 }, { "--press": 0.86, duration: 0.07, ease: "power2.out", ...NI }, t);
        tl.fromTo(RIG, { "--press": 0.86 }, { "--press": 1, duration: 0.14, ease: "power2.out", ...NI }, t + 0.07);
      };
      const curShow = (t, on, d = 0.4) =>
        tl.fromTo("#walk-cursor", { opacity: on ? 0 : 1 }, { opacity: on ? 1 : 0, duration: d, ease: "power1.out", ...NI }, t);
      // Stands in for the app's own quick response (a page or tooltip appearing): real speed.
      const fadeIn = (sel, t, d = 0.12) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out", ...NI }, t);

      // ---- Captions: three entrances in rotation, one exit. ----
      const capWords = (id, t, end) => {
        tl.fromTo(`#${id} .w`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.26, stagger: 0.134, ease: "power2.out", ...NI }, t);
        capOut(id, end);
      };
      const capInk = (id, t, end) => {
        tl.fromTo(`#${id} .w`, { color: "#c9c9c4" }, { color: "#000000", duration: 0.24, stagger: 0.16, ease: "power1.out", ...NI }, t);
        capOut(id, end);
      };
      const capLine = (id, t, end) => {
        tl.fromTo(`#${id} .line`, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.36, ease: "power2.out", ...NI }, t);
        capOut(id, end);
      };
      const capOut = (id, end) => {
        tl.fromTo(`#${id} .line`, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in", ...NI }, end - 0.3);
      };

      // Pace: every time below is twice the first cut's (2026-11-26), up to the zoom at 128.8.
      // Kept at real speed: the app's recorded animations, its quick responses (fadeIn) and the
      // click press. The zoom through the mark and the end card keep their original speed.

      // ===== Login (0 – 16.4) =====
      capWords("walk-cap-1", 0.5, 8.8);
      camTo(4.4, 2.4, 1097, 440, 1.85);
