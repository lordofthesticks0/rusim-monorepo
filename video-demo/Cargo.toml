[package]
name = "video-demo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fframes = { version = "=1.4.0", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { version = "=1.4.0", features = ["vulkan", "cli"] }
fframes_native_player = { version = "=1.4.0", default-features = false, features = ["vulkan", "audio"] }
# fframes 1.4.0 accepts any fframes-media 1.4.x, but 1.4.1 renamed a type it uses
# and the build fails. Pin the media crates to the release fframes 1.4.0 was built with.
fframes-media = "=1.4.0"
fframes-media-dir-macro = "=1.4.0"

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.4.0", features = ["h264", "libav-agree-gpl"] }

[lib]
name = "video_demo"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "video-demo"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

