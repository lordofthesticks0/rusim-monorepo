; PlatformIO project for rusim-monorepo.
; CLI-only workflow (no IDE required):
;   pio run                  ; build all firmwares
;   pio run -e <env>         ; build one firmware
;   pio run -e <env> -t upload [--upload-port /dev/ttyUSB0]
;   pio device monitor -e <env>
;
; Board mapping (per request):
;   co2-calibrate      -> Arduino Nano (arduino:avr:nano)
;   methane-calibrate  -> Arduino Mega 2560 (arduino:avr:mega)
;   pressure-calibrate -> Arduino Mega 2560 (arduino:avr:mega)

[platformio]
default_envs = co2-calibrate, methane-calibrate, pressure-calibrate
src_dir = firmware

[env]
platform = atmelavr
framework = arduino

[env:co2-calibrate]
board = nanoatmega328
monitor_speed = 9600
build_src_filter = +<co2-calibrate/>
; upload_port = /dev/ttySomething
; monitor_port = /dev/ttySomething

[env:methane-calibrate]
board = megaatmega2560
monitor_speed = 115200
build_src_filter = +<methane-calibrate/>
; upload_port = /dev/ttySomething
; monitor_port = /dev/ttySomething

[env:pressure-calibrate]
board = megaatmega2560
monitor_speed = 115200
build_src_filter = +<pressure-calibrate/>
lib_deps = robtillaart/HX711@^0.6.5
; upload_port= /dev/ttySomething
; monitor_port = /dev/ttySomething
