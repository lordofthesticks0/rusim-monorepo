; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = firmware

[env]
platform = atmelavr
framework = arduino

[env:blink-test]
board = megaatmega2560
monitor_speed = 9600
build_src_filter = +<blink-test/>
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:loadcell-test]
board = megaatmega2560
monitor_speed = 115200
build_src_filter = +<loadcell-test/>
lib_deps = robtillaart/HX711@^0.6.5
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:co2-calibrate]
board = megaatmega2560
monitor_speed = 9600
build_src_filter = +<co2-calibrate/>
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:methane-calibrate]
board = megaatmega2560
monitor_speed = 115200
build_src_filter = +<methane-calibrate/>
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:pressure-calibrate]
board = megaatmega2560
monitor_speed = 115200
build_src_filter = +<pressure-calibrate/>
lib_deps = robtillaart/HX711@^0.6.5
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:max485-test1]
board = megaatmega2560
monitor_speed = 9600
build_src_filter = +<max485-test/>
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:max485-test2]
board = nanoatmega328
monitor_speed = 9600
build_src_filter = +<max485-test/>
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:display-v9]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<display-v9/> -<display-v9/sim/>
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.psram_type = opi
build_flags =
	-D BOARD_HAS_PSRAM
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D LV_CONF_INCLUDE_SIMPLE
	-I firmware/display-v9
	; Uncomment for debug builds (shows DEBUG shortcuts, e.g. login bypass on /setup):
	; -DIS_DEBUG=1
lib_deps =
	lvgl/lvgl@9.3.0
	moononournation/GFX Library for Arduino@1.2.8
	tamctec/TAMC_GT911@^1.0.2
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:display-sim]
; Native PC build of the display-v9 UI over LVGL's SDL driver.
; The screens, fake-data model and serial protocol compile unchanged; a
; shim (sim/Arduino.h) plus stubbed link_modbus/provision_ap replace the
; ESP32 hardware. Run: pio run -e display-sim -t exec
platform = native
framework =
build_src_filter =
	+<display-v9/>
	-<display-v9/main.cpp>
	-<display-v9/link_modbus.cpp>
	-<display-v9/provision_ap.cpp>
build_flags =
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D LV_CONF_INCLUDE_SIMPLE
	-I firmware/display-v9/sim
	-I firmware/display-v9
	-lSDL2
	${env:display-v9.build_flags}
lib_deps =
	lvgl/lvgl@9.3.0
build_type = release

[env:wt32-eth01_ping-test]
platform = espressif32
board = wt32-eth01
framework = arduino
monitor_speed = 115200
build_src_filter = +<wt32-eth01_ping-test/>
lib_deps =
	dvarrel/ESPping@^1.0.5
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:wt32-eth01_captive-recon]
platform = espressif32
board = wt32-eth01
framework = arduino
monitor_speed = 115200
build_src_filter = +<wt32-eth01_captive-recon/>
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:motor-driver]
; Use nanoatmega328new for Nanos with the New Bootloader (115200 baud upload).
; If upload fails with "stk500_recv(): programmer is not responding",
; switch board to nanoatmega328 below (Old Bootloader, 57600 baud upload).
board = nanoatmega328new
monitor_speed = 115200
build_src_filter = +<motor-driver/>
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:network-master]
; Production WT32 firmware: Ethernet portal login with credentials sourced
; from the display over Modbus RTU (master, slave ID 1, 9600 8N1 on
; Serial1 RX=IO5 / TX=IO17). See docs/llm-generated/network-master.md.
platform = espressif32
board = wt32-eth01
framework = arduino
monitor_speed = 115200
build_src_filter = +<network-master/>
lib_deps =
	dvarrel/ESPping@^1.0.5
platform_packages = platformio/tool-esptoolpy@^2.41100.260830
