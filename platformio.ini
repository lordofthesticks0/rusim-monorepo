; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = firmware

[env]
platform = atmelavr
framework = arduino
extra_scripts = pre:scripts/compilation_db.py

[env:blink-test]
board = megaatmega2560
monitor_speed = 9600
build_src_filter = +<blink-test/>
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:co2-calibrate]
board = nanoatmega328
monitor_speed = 9600
build_src_filter = +<co2-calibrate/>
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:methane-calibrate]
board = megaatmega2560
monitor_speed = 115200
build_src_filter = +<methane-calibrate/>
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:pressure-calibrate]
board = megaatmega2560
monitor_speed = 115200
build_src_filter = +<pressure-calibrate/>
lib_deps = robtillaart/HX711@^0.6.5
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:max485-test1]
board = megaatmega2560
monitor_speed = 9600
build_src_filter = +<max485-test/>
lib_deps = circuitstate/CSE_ArduinoRS485@^1.0.14
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:max485-test2]
board = nanoatmega328
monitor_speed = 9600
build_src_filter = +<max485-test/>
lib_deps = circuitstate/CSE_ArduinoRS485@^1.0.14
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:display]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<display/>
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.psram_type = opi
build_flags = 
	-D BOARD_HAS_PSRAM
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D LV_CONF_INCLUDE_SIMPLE
	-I firmware/display
lib_deps = 
	lvgl/lvgl@8.3.6
	moononournation/GFX Library for Arduino@1.2.8
	tamctec/TAMC_GT911@^1.0.2
platform_packages = platformio/tool-esptoolpy@^2.41100.260830

[env:display-v9]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<display-v9/>
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.psram_type = opi
build_flags =
	-D BOARD_HAS_PSRAM
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D LV_CONF_INCLUDE_SIMPLE
	-I firmware/display-v9
lib_deps =
	lvgl/lvgl@9.3.0
	moononournation/GFX Library for Arduino@1.2.8
	tamctec/TAMC_GT911@^1.0.2
platform_packages = platformio/tool-esptoolpy@^2.41100.260830
